name: Build WASM ES5

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.50
    
    - name: Setup Meson
      run: pip install meson ninja
    
    - name: Configure
      run: |
        cat > emscripten.txt << 'EOF'
        [binaries]
        c = 'emcc'
        cpp = 'em++'
        ar = 'emar'
        
        [host_machine]
        system = 'emscripten'
        cpu_family = 'wasm32'
        cpu = 'wasm32'
        endian = 'little'
        
        [properties]
        c_args = ['-s', 'LEGACY_VM_SUPPORT=1', '-s', 'EXPORT_ES6=0']
        cpp_args = ['-s', 'LEGACY_VM_SUPPORT=1', '-s', 'EXPORT_ES6=0']
        link_args = ['-s', 'WASM=1', '-s', 'MODULARIZE=1']
        EOF
        
        meson setup build \
          --cross-file emscripten.txt \
          --default-library static \
          --buildtype release
    
    - name: Build
      run: ninja -C build
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: wasm-es5
        path: |
          build/*.js
          build/*.wasm
